<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Extensive readout and operational obligations</title>
  <desc id="desc">Primitive relations constitute a dependent role history and local occurrence identities. Their derived profile carrier has product width and binary width two to the number of stages. A downstream obligation regime has full exponential width exactly when it keeps those identities distinct and separately addressable. The executed reduction instead uses the discovered action and its separate preservation proof to group the same source identities into one operational obligation without identifying them.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#edf3f6"/>
    </linearGradient>
    <linearGradient id="relations" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d5a"/>
      <stop offset="1" stop-color="#235f7e"/>
    </linearGradient>
    <linearGradient id="profiles" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c6b66"/>
      <stop offset="1" stop-color="#159087"/>
    </linearGradient>
    <linearGradient id="regime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c470e"/>
      <stop offset="1" stop-color="#a56b1d"/>
    </linearGradient>
    <linearGradient id="full" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#633451"/>
      <stop offset="1" stop-color="#8d4a73"/>
    </linearGradient>
    <linearGradient id="reduced" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#385326"/>
      <stop offset="1" stop-color="#5d7e3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#40576a"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Segoe UI, sans-serif; fill: #17324a; }
      .subtitle { font: 400 17px Inter, Segoe UI, sans-serif; fill: #526979; }
      .layer { font: 700 21px Inter, Segoe UI, sans-serif; fill: #fff; }
      .metric { font: 700 17px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #fff; }
      .bodyLight { font: 400 15px Inter, Segoe UI, sans-serif; fill: #f2f8fb; }
      .body { font: 400 15px Inter, Segoe UI, sans-serif; fill: #334e60; }
      .sideTitle { font: 700 18px Inter, Segoe UI, sans-serif; fill: #29465b; }
      .code { font: 600 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #29465b; }
      .label { font: 700 14px Inter, Segoe UI, sans-serif; fill: #40576a; }
      .arrow { fill: none; stroke: #40576a; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#background)"/>
  <text x="70" y="58" class="title">Extensive readout and operational obligations</text>
  <text x="70" y="89" class="subtitle">Constitution of identities first; operational conservation or grouping afterwards</text>

  <g filter="url(#shadow)">
    <rect x="250" y="125" width="1100" height="145" rx="18" fill="url(#relations)"/>
    <text x="290" y="168" class="layer">1 · Primitive relations and dependent role history</text>
    <text x="290" y="205" class="bodyLight">Source · formation · target · provenance, each with positive witnesses</text>
    <text x="290" y="233" class="bodyLight">The next stage starts at the exact state produced by the preceding stage.</text>
  </g>

  <path d="M800 270 L800 326" class="arrow"/>
  <text x="824" y="307" class="label">derive occurrences and profiles</text>

  <g filter="url(#shadow)">
    <rect x="250" y="340" width="1100" height="180" rx="18" fill="url(#profiles)"/>
    <text x="290" y="383" class="layer">2 · Constituted occurrence identities and complete profile frontier</text>
    <text x="290" y="420" class="bodyLight">One actual occurrence is selected at every role; the frontier is complete and duplicate-free.</text>
    <text x="290" y="448" class="bodyLight">No program, Boolean readout, numeric address, or obligation regime constitutes these identities.</text>
    <text x="290" y="489" class="metric">extensive readout = product(local arities) · binary case: 2^stageCount</text>
  </g>

  <path d="M800 520 L800 578" class="arrow"/>
  <text x="824" y="557" class="label">surjective carry into obligations</text>

  <g filter="url(#shadow)">
    <rect x="420" y="592" width="760" height="128" rx="18" fill="url(#regime)"/>
    <text x="460" y="635" class="layer">3 · Downstream obligation regime</text>
    <text x="460" y="671" class="bodyLight">It may preserve every source identity separately or group several identities.</text>
    <text x="460" y="699" class="metric">carry : source identity → operational obligation</text>
  </g>

  <path d="M650 720 L650 778" class="arrow"/>
  <path d="M950 720 L950 778" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="95" y="792" width="690" height="190" rx="18" fill="url(#full)"/>
    <text x="135" y="835" class="layer">4A · Separate conservation</text>
    <text x="135" y="872" class="bodyLight">carry is injective; addressing factors through obligations.</text>
    <text x="135" y="904" class="metric">regime width = 2^stageCount</text>
    <line x1="135" y1="927" x2="745" y2="927" stroke="#f3ddea" stroke-width="2"/>
    <text x="135" y="960" class="metric">exponential width ↔ distinct + separately addressable</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="815" y="792" width="690" height="190" rx="18" fill="url(#reduced)"/>
    <text x="855" y="835" class="layer">4B · Executed grouping</text>
    <text x="855" y="872" class="bodyLight">Discovered action + separate preservation license the reduction.</text>
    <text x="855" y="904" class="metric">retained operational width = 1</text>
    <line x1="855" y1="927" x2="1465" y2="927" stroke="#dcebd2" stroke-width="2"/>
    <text x="855" y="960" class="metric">identities stay distinct; obligation status is grouped</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1220" y="555" width="310" height="176" rx="15" fill="#fff" stroke="#b8c7d1" stroke-width="2"/>
    <text x="1248" y="594" class="sideTitle">Downstream program</text>
    <text x="1248" y="628" class="body">Compiled from the same roles.</text>
    <text x="1248" y="654" class="body">Acts on constituted profiles;</text>
    <text x="1248" y="680" class="body">does not create alternatives.</text>
    <text x="1248" y="711" class="code">interpret(profile) = executed output</text>
  </g>
  <path d="M1350 505 L1375 505 L1375 541" class="arrow"/>
</svg>
