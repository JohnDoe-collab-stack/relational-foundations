<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">Constitutive normalizer succinctness</title>
  <desc id="desc">One authoritative dependent role history for input k indexes two exact readings. The structural reading contains two to the k plus one complete duplicate-free profiles and any injective finite addressing needs at least that many slots. The executed reading contains an authoritative program of exactly k plus one returned transport atoms according to compiledLocalSize, whose interpreter equals the canonical normalizer on every accepted profile. Operational width, instrumented work, and projection non-factorization are displayed as separate results. The comparison is representation-relative and does not assert a universal time or memory lower bound.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#102843"/>
    </linearGradient>
    <linearGradient id="history" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143e59"/>
      <stop offset="1" stop-color="#0d2c43"/>
    </linearGradient>
    <linearGradient id="structural" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3b72"/>
      <stop offset="1" stop-color="#32254d"/>
    </linearGradient>
    <linearGradient id="program" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d5e50"/>
      <stop offset="1" stop-color="#103b36"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020914" flood-opacity="0.45"/>
    </filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fd3ff"/>
    </marker>
    <marker id="violetArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c7a5ff"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#76e0b7"/>
    </marker>
    <style>
      .title { font: 700 34px system-ui, sans-serif; fill: #f4f8ff; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #b9cce1; }
      .section { font: 700 18px system-ui, sans-serif; letter-spacing: .7px; fill: #9bdcff; }
      .label { font: 650 19px system-ui, sans-serif; fill: #f4f8ff; }
      .body { font: 400 15px system-ui, sans-serif; fill: #d5e2ef; }
      .small { font: 400 13px system-ui, sans-serif; fill: #b9cce1; }
      .metric { font: 750 25px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #ffffff; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #d7f1ff; }
      .card { stroke: #4d7795; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .blue { fill: none; stroke: #8fd3ff; stroke-width: 3; marker-end: url(#blueArrow); }
      .violet { fill: none; stroke: #c7a5ff; stroke-width: 3; marker-end: url(#violetArrow); }
      .green { fill: none; stroke: #76e0b7; stroke-width: 3; marker-end: url(#greenArrow); }
      .divider { stroke: #38536c; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="1080" fill="url(#background)"/>
  <text x="70" y="58" class="title">Constitutive normalizer succinctness</text>
  <text x="70" y="89" class="subtitle">One dependent executed history, two exact representation metrics, one constructive comparison.</text>

  <text x="70" y="132" class="section">COMMON CONSTITUTED INDEX</text>
  <rect x="220" y="151" width="1000" height="128" fill="url(#history)" class="card"/>
  <text x="260" y="193" class="label">Authoritative dependent role history</text>
  <text x="260" y="224" class="mono">ThreadedConstitutiveRoleHistory · k = input</text>
  <text x="260" y="250" class="body">Every tail is indexed by the state produced by the preceding executed stage.</text>
  <rect x="950" y="183" width="220" height="58" rx="12" fill="#0b2238" stroke="#8fd3ff"/>
  <text x="977" y="218" class="metric">k+1 stages</text>

  <path d="M520 279 C520 320 400 326 400 360" class="violet"/>
  <path d="M920 279 C920 320 1040 326 1040 360" class="green"/>

  <text x="70" y="337" class="section">STRUCTURAL READING</text>
  <rect x="70" y="360" width="600" height="220" fill="url(#structural)" class="card"/>
  <text x="104" y="402" class="label">Complete profile carrier</text>
  <text x="104" y="435" class="body">One Boolean structural role per constituted opening.</text>
  <text x="104" y="461" class="body">Complete and duplicate-free enumeration.</text>
  <rect x="104" y="488" width="532" height="66" rx="12" fill="#241b38" stroke="#c7a5ff"/>
  <text x="128" y="530" class="metric">structuralWidth = 2^(k+1)</text>

  <text x="770" y="337" class="section">EXECUTED PROGRAM READING</text>
  <rect x="770" y="360" width="600" height="220" fill="url(#program)" class="card"/>
  <text x="804" y="402" class="label">Authoritative normalizer program</text>
  <text x="804" y="435" class="body">One typed instruction per executed opening.</text>
  <text x="804" y="461" class="body">Each instruction equals that execution's returned code.</text>
  <rect x="804" y="488" width="532" height="66" rx="12" fill="#0b2d28" stroke="#76e0b7"/>
  <text x="833" y="523" class="metric">compiledLocalSize = k+1</text>
  <text x="865" y="546" class="small">program.codeSize = compiledLocalSize</text>

  <path d="M370 580 L370 630" class="violet"/>
  <path d="M1070 580 L1070 630" class="green"/>

  <rect x="70" y="632" width="600" height="142" fill="#17172e" class="card"/>
  <text x="104" y="674" class="label">Independent finite addressing</text>
  <text x="104" y="706" class="mono">injective slotOf : profile → Fin slotCount</text>
  <text x="104" y="744" class="metric">2^(k+1) ≤ slotCount</text>

  <rect x="770" y="632" width="600" height="142" fill="#0d2928" class="card"/>
  <text x="804" y="674" class="label">Exact executable semantics</text>
  <text x="804" y="706" class="body">interpreter = canonical normalizer on every accepted profile</text>
  <text x="804" y="736" class="body">erasure = exact returned-code history</text>
  <text x="804" y="760" class="small">authority proof is separate from the raw program</text>

  <line x1="720" y1="355" x2="720" y2="782" class="divider" stroke-dasharray="7 8"/>

  <text x="70" y="824" class="section">SEPARATE FORMAL RESULTS — NOT PREMISES OF THE SIZE COMPARISON</text>

  <rect x="70" y="846" width="400" height="132" fill="#12253a" class="card"/>
  <text x="98" y="878" class="small">DERIVED READOUT</text>
  <text x="98" y="910" class="label">Operational width</text>
  <text x="98" y="940" class="mono">width trace ≤ 2</text>
  <text x="98" y="963" class="small">not a runtime-memory measure</text>

  <rect x="520" y="846" width="400" height="132" fill="#172a32" class="card"/>
  <text x="548" y="878" class="small">SEPARATE THEOREM</text>
  <text x="548" y="910" class="label">Internal instrumented cost</text>
  <text x="548" y="940" class="mono">instrumentedWork ≤ polynomial(input)</text>
  <text x="548" y="963" class="small">not inferred from operational width</text>

  <rect x="970" y="846" width="400" height="132" fill="#2c2037" class="card"/>
  <text x="998" y="878" class="small">SEPARATE NON-FACTORIZATION THEOREM</text>
  <text x="998" y="910" class="label">Audited state-and-quantity projection</text>
  <text x="998" y="940" class="body">same projected view can remain possible</text>
  <text x="998" y="963" class="mono">different total actions</text>

  <rect x="350" y="1006" width="740" height="46" rx="14" fill="#0b1c30" stroke="#8fd3ff" stroke-width="1.4"/>
  <text x="407" y="1035" class="body">Exact relative comparison · no universal time or memory lower-bound claim</text>
</svg>
